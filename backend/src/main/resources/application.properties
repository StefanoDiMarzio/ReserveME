# ============================================
# ReserveME - Application Configuration
# ============================================

# --- Server ---
server.port=8080

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/reserveme
spring.datasource.username=reserveme_user
spring.datasource.password=reserveme_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Necessario perché i controller admin (pre-esistenti) restituiscono entità JPA con relazioni
# lazy direttamente come JSON: senza OSIV la sessione si chiude prima della serializzazione
# e Jackson fallisce su "no session". I nuovi endpoint /api/public e /api/app usano DTO e
# @Transactional espliciti, quindi non dipendono da questa impostazione.
spring.jpa.open-in-view=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- Mail (Mailpit config) ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- JWT ---
jwt.secret=ReserveME-Secret-Key-Change-In-Production-Min-256-Bits-Long-Key-Here
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# --- Google Maps Platform ---
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# --- Orari negozio (MVP, default fisso in attesa di orari per-negozio) ---
app.orari.apertura-default=09:00
app.orari.chiusura-default=19:00

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Logging ---
logging.level.com.reserveme=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
