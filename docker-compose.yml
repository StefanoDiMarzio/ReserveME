version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: reserveme-db
    environment:
      POSTGRES_USER: reserveme_user
      POSTGRES_PASSWORD: reserveme_pass
      POSTGRES_DB: reserveme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserveme_user -d reserveme"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reserveme-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reserveme-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/reserveme
      - SPRING_DATASOURCE_USERNAME=reserveme_user
      - SPRING_DATASOURCE_PASSWORD=reserveme_pass
      - JWT_SECRET=Production-Secret-Key-Change-Me-Now-Must-Be-256-Bits
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
    depends_on:
      db:
        condition: service_healthy
    networks:
      - reserveme-network

  mailpit:
    image: axllent/mailpit
    container_name: reserveme-mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP server
    networks:
      - reserveme-network

volumes:
  postgres_data:

networks:
  reserveme-network:
    driver: bridge
